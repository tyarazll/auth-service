</div>

<script>

let isLogin = true;

function toggleMode(){

    isLogin = !isLogin;

    document.getElementById("formTitle").innerText =
        isLogin ? "Login Sistem" : "Registrasi Akun";

    document.getElementById("actionBtn").innerHTML =
        isLogin
        ? '<i class="fa-solid fa-right-to-bracket me-2"></i>Masuk'
        : '<i class="fa-solid fa-user-plus me-2"></i>Daftar';

    document.getElementById("switchText").innerHTML =
        isLogin
        ? 'Belum punya akun? <a href="#" onclick="toggleMode()" class="fw-bold text-decoration-none">Daftar di sini</a>'
        : 'Sudah punya akun? <a href="#" onclick="toggleMode()" class="fw-bold text-decoration-none">Login di sini</a>';

    document.getElementById("alertBox").classList.add("d-none");
}

function showAlert(message, success){

    const alertBox =
        document.getElementById("alertBox");

    alertBox.innerText = message;

    alertBox.className =
        success
        ? "alert alert-success text-center fw-bold"
        : "alert alert-danger text-center fw-bold";

    alertBox.classList.remove("d-none");
}

async function handleAuth(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if(!username || !password){

        showAlert(
            "Username dan Password wajib diisi",
            false
        );

        return;
    }

    const endpoint =
        isLogin
        ? "/api/auth/login"
        : "/api/auth/register";

    try{

        const response = await fetch(endpoint,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username,
                password
            })

        });

        const data =
            await response.json();

        if(response.ok){

            if(isLogin){

                localStorage.setItem(
                    "token",
                    data.token
                );

                localStorage.setItem(
                    "username",
                    username
                );

                localStorage.setItem(
                    "role",
                    data.role
                );

                if(data.role === 'admin'){

                    window.location.href =
                        'admin.html';

                }else{

                    window.location.href =
                        'dashboard.html';

                }

            }else{

                showAlert(
                    "Registrasi berhasil, silakan login",
                    true
                );

                setTimeout(()=>{
                    toggleMode();
                },1500);

            }

        }else{

            showAlert(
                data.error ||
                data.message ||
                "Terjadi kesalahan",
                false
            );

        }

    }catch(error){

        console.error(error);

        showAlert(
            "Gagal terhubung ke server",
            false
        );

    }

}

</script>
