<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Service - Kelompok Tyara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #005088 0%, #002244 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden; width: 100%; max-width: 450px; }
        .card-header { background: #fff; text-align: center; padding: 30px 20px 10px; border-bottom: none; }
        .logo-icon { font-size: 40px; color: #005088; margin-bottom: 10px; }
        .btn-primary { background-color: #005088; border: none; padding: 12px; font-weight: bold; border-radius: 8px; }
        .btn-primary:hover { background-color: #003d66; }
        .form-control { padding: 12px 15px; border-radius: 8px; }
        .input-group-text { background-color: transparent; border-right: none; color: #6c757d; }
        .form-control { border-left: none; }
        .form-control:focus { box-shadow: none; border-color: #dee2e6; }
        #dashboard { display: none; }
        .token-box { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 13px; word-break: break-all; margin-top: 20px; color: #d63384;}
    </style>
</head>
<body>

    <div class="card" id="authCard">
        <div class="card-header">
            <i class="fa-solid fa-shield-halved logo-icon"></i>
            <h4 class="fw-bold" id="formTitle">Login Sistem</h4>
            <p class="text-muted small">Secure Software Engineering - Auth Service</p>
        </div>
        <div class="card-body p-4">
            
            <div id="alertBox" class="alert d-none" role="alert"></div>

            <form id="authForm">
                <div class="mb-3 input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan Username" required>
                </div>
                <div class="mb-4 input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan Password" required>
                </div>
                <button type="button" class="btn btn-primary w-100" id="actionBtn" onclick="handleAuth()">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted small" id="switchText">
                    Belum punya akun? <a href="#" class="text-decoration-none fw-bold" style="color: #005088;" onclick="toggleMode()">Daftar di sini</a>
                </p>
            </div>
        </div>
    </div>

    <div class="card" id="dashboard" style="max-width: 600px;">
        <div class="card-body p-5 text-center">
            <i class="fa-solid fa-circle-check text-success" style="font-size: 60px; margin-bottom: 20px;"></i>
            <h3 class="fw-bold">Akses Diberikan!</h3>
            <p class="text-muted">Selamat datang, kamu berhasil masuk ke dalam sistem yang dilindungi.</p>
            
            <div class="token-box text-start">
                <strong><i class="fa-solid fa-key me-2"></i>Token Akses JWT (Rahasia):</strong><br><br>
                <span id="tokenDisplay"></span>
            </div>

            <button class="btn btn-danger w-100 mt-4" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket me-2"></i>Keluar (Logout)
            </button>
        </div>
    </div>

    <script>
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('formTitle').innerText = isLogin ? "Login Sistem" : "Registrasi Akun";
            document.getElementById('actionBtn').innerHTML = isLogin ? '<i class="fa-solid fa-right-to-bracket me-2"></i>Masuk' : '<i class="fa-solid fa-user-plus me-2"></i>Daftar';
            document.getElementById('switchText').innerHTML = isLogin 
                ? 'Belum punya akun? <a href="#" class="text-decoration-none fw-bold" style="color: #005088;" onclick="toggleMode()">Daftar di sini</a>'
                : 'Sudah punya akun? <a href="#" class="text-decoration-none fw-bold" style="color: #005088;" onclick="toggleMode()">Login di sini</a>';
            document.getElementById('alertBox').classList.add('d-none');
        }

        function showAlert(msg, isSuccess) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = msg;
            alertBox.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'} text-center fw-bold`;
            alertBox.classList.remove('d-none');
        }

        async function handleAuth() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';

            if (!user || !pass) {
                showAlert("Username dan password wajib diisi!", false);
                return;
            }

            try {
                // Inilah bagian yang menghubungkan tampilan web ke sistem Node.js kalian!
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (response.ok) {
                    if (isLogin) {
                        document.getElementById('authCard').style.display = 'none';
                        document.getElementById('dashboard').style.display = 'block';
                        document.getElementById('tokenDisplay').innerText = data.token;
                    } else {
                        showAlert("Registrasi sukses! Silakan login.", true);
                        setTimeout(toggleMode, 1500); // Otomatis pindah ke form login
                    }
                } else {
                    // Kalau kena Rate Limit (429) atau password salah, akan muncul di sini
                    showAlert(data.error || data.message || "Terjadi kesalahan!", false);
                }
            } catch (err) {
                showAlert("Gagal terhubung ke server Node.js", false);
            }
        }

        function logout() {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('authCard').style.display = 'block';
            document.getElementById('alertBox').classList.add('d-none');
        }
    </script>
</body>
</html>
